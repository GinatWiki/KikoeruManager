name: Build Windows EXE / Installer and Release

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.3.14, optional when triggered by tag push)'
        required: false
        type: string
      build_only:
        description: 'Only build EXEs, skip release (for branch pushes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: frontend
      env:
        # 前端侧边栏版本号与资源前缀都来自这个环境变量，缺失会显示 dev
        KIKOERUMANAGER_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        npm ci
        npm run build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pyinstaller pystray pillow

    - name: Download embedded PostgreSQL and Redis runtime
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $pgZip = Join-Path $env:RUNNER_TEMP "postgresql.zip"
        Invoke-WebRequest -Uri "https://get.enterprisedb.com/postgresql/postgresql-18.4-1-windows-x64-binaries.zip" -OutFile $pgZip -UseBasicParsing
        $pgRoot = Join-Path $env:RUNNER_TEMP "pg"
        Expand-Archive -LiteralPath $pgZip -DestinationPath $pgRoot -Force
        New-Item -ItemType Directory -Force -Path "tools\postgres" | Out-Null
        Copy-Item -LiteralPath (Join-Path $pgRoot "pgsql") -Destination "tools\postgres\pgsql" -Recurse -Force
        foreach ($remove in @("doc", "include", "symbols", "installer", "pgAdmin 4", "StackBuilder")) {
          $target = Join-Path "tools\postgres\pgsql" $remove
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
        }
        $redisZip = Join-Path $env:RUNNER_TEMP "redis.zip"
        Invoke-WebRequest -Uri "https://github.com/redis-windows/redis-windows/releases/download/8.10.0/Redis-8.10.0-Windows-x64-msys2.zip" -OutFile $redisZip -UseBasicParsing
        $redisRoot = Join-Path $env:RUNNER_TEMP "redis"
        Expand-Archive -LiteralPath $redisZip -DestinationPath $redisRoot -Force
        New-Item -ItemType Directory -Force -Path "tools\redis" | Out-Null
        # 完整携带 msys2 版 Redis：redis-server / redis-cli 及运行时 DLL 必须同目录，
        # 缺失 DLL 时 redis-server.exe 无法启动（STATUS_DLL_NOT_FOUND）。
        # redis-cli 供桌面端退出时 SHUTDOWN 优雅落盘 AOF。
        $required = @('redis-server.exe', 'redis-cli.exe', 'msys-2.0.dll', 'msys-crypto-3.dll', 'msys-gcc_s-seh-1.dll', 'msys-ssl-3.dll', 'msys-stdc++-6.dll')
        foreach ($name in $required) {
          $item = Get-ChildItem -LiteralPath $redisRoot -Filter $name -Recurse | Select-Object -First 1
          if ($item) {
            Copy-Item -LiteralPath $item.FullName -Destination "tools\redis\$name" -Force
          } else {
            Write-Warning "$name 未在 Redis 包中找到，内置 Redis 可能无法启动"
          }
        }
        Get-ChildItem tools -Recurse -Filter *.exe | Select-Object -First 5 FullName, Length

    - name: Build EXE (console + noconsole)
      working-directory: backend
      env:
        KIKOERUMANAGER_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      run: python build.py

    - name: Build Windows installer (Inno Setup)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $tag = "${{ github.event.inputs.tag || github.ref_name }}"
        if (-not $tag.StartsWith("v")) { $tag = "v" + $tag }
        $version = $tag.Substring(1)

        # 运行器镜像通常预装 Inno Setup 6；没有则回落 Chocolatey 安装。
        $isccCandidates = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
        )
        $iscc = $isccCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
        if (-not $iscc) {
          Write-Host "未预装 Inno Setup，改用 Chocolatey 安装..."
          choco install innosetup --no-progress -y
          $iscc = $isccCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
        }
        if (-not $iscc) { throw "未找到 ISCC.exe，无法构建安装包" }
        Write-Host "使用编译器: $iscc"

        $langFile = (Resolve-Path -LiteralPath "installer\windows\ChineseSimplified.isl").Path
        $outputDir = (Get-Location).Path
        $baseName = "kikoerumanager-$tag-windows-setup"
        & $iscc "installer\windows\KikoeruManager.iss" "/DMyAppVersion=$version" "/DMyLangFile=$langFile" "/O$outputDir" "/F$baseName"
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败 (exit=$LASTEXITCODE)" }

        $setupExe = Join-Path $outputDir "$baseName.exe"
        if (-not (Test-Path -LiteralPath $setupExe)) { throw "安装包未生成: $setupExe" }
        Get-Item -LiteralPath $setupExe | Select-Object Name, @{n='大小MB';e={[math]::Round($_.Length / 1MB, 1)}}

    - name: Upload EXE artifacts (branch push)
      if: github.ref_name == 'main' && !startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: kikoerumanager-windows-exe
        path: |
          backend/dist/KikoeruManager.exe
          backend/dist/KikoeruManager-noconsole.exe
          kikoerumanager-*-windows-setup.exe

    - name: Verify EXE outputs
      shell: pwsh
      working-directory: backend
      run: |
        Get-ChildItem dist/KikoeruManager.exe, dist/KikoeruManager-noconsole.exe | Select-Object Name, Length
        if (-not (Test-Path dist/KikoeruManager.exe)) { throw "dist/KikoeruManager.exe 未生成" }
        if (-not (Test-Path dist/KikoeruManager-noconsole.exe)) { throw "dist/KikoeruManager-noconsole.exe 未生成" }

    - name: Package archives
      shell: pwsh
      run: |
        $tag = "${{ github.event.inputs.tag || github.ref_name }}"
        if (-not $tag.StartsWith("v")) { $tag = "v" + $tag }
        Compress-Archive -Path backend/dist/KikoeruManager.exe, tools -DestinationPath "kikoerumanager-$tag-windows-console.zip" -Force
        Compress-Archive -Path backend/dist/KikoeruManager-noconsole.exe, tools -DestinationPath "kikoerumanager-$tag-windows-noconsole.zip" -Force
        Get-ChildItem *.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.build_only)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        name: ${{ github.event.inputs.tag || github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          *.zip
          *.exe

    - name: Upload ZIP artifacts (branch push)
      if: github.ref_name == 'main' && !startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: kikoerumanager-windows-zip
        path: |
          *.zip
