name: Build and Push to GitHub Container Registry

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

# main 推送与 tag 推送会同时向 latest 标签推镜像，并发时 ghcr 报 unknown blob，
# 这里按 workflow 串行排队
concurrency:
  group: ghcr-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Build and push Docker image
      env:
        IMAGE: ghcr.io/${{ github.repository }}
      run: |
        set -euo pipefail
        IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
        REF_NAME="${{ github.ref_name }}"
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="$REF_NAME"
          VER_NO_V="${VERSION#v}"
          MAJOR_MINOR="${VER_NO_V%.*}"
          TAGS=("$IMAGE_LOWER:$VERSION" "$IMAGE_LOWER:$MAJOR_MINOR" "$IMAGE_LOWER:latest")
        else
          TAGS=("$IMAGE_LOWER:edge" "$IMAGE_LOWER:latest")
        fi
        BUILD_ARGS=()
        for t in "${TAGS[@]}"; do
          BUILD_ARGS+=("-t" "$t")
        done
        docker build --no-cache \
          --build-arg "KIKOERUMANAGER_VERSION=$REF_NAME" \
          --label "org.opencontainers.image.version=$REF_NAME" \
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
          "${BUILD_ARGS[@]}" .
        for t in "${TAGS[@]}"; do
          echo "推送镜像: $t"
          docker push "$t"
        done

    - name: Update package description (best effort)
      run: |
        curl -fsS -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}" \
          -d '{"description":"DLsite 作品自动整理工具 - 支持智能查重、自动解压、元数据获取"}' \
        || echo "包描述更新失败（不影响构建结果）"
